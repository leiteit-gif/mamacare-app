# Gradle configuration for Android build
# This file contains settings to fix common build issues

# Gradle version
org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=512m

# Enable parallel build
org.gradle.parallel=true

# Use daemon for faster builds
org.gradle.daemon=true

# Android SDK versions
android.compileSdkVersion=34
android.targetSdkVersion=34
android.minSdkVersion=24

# Kotlin version - Updated to supported version
kotlin.version=2.0.21

# Enable new build features
android.enableNewResourceShrinker=true
android.enableOnDemandModules=true

# Fix for React Native Gesture Handler
android.useAndroidX=true
android.enableJetifier=true

# Disable deprecated warning
android.disableResourceValidation=true

# Enable AndroidX
androidx.appcompat.enableColorCompat=false

# KSP configuration
ksp.version=2.0.21
