# Build configuration for Gradle
# This file helps resolve React Native Gesture Handler build issues

# Java compilation options
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Android compilation options
android.compileSdkVersion=36
android.targetSdkVersion=35
android.minSdkVersion=24

# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin options
kotlin.code.style=official
kotlin.jvm.target=11

# Gradle options
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# Disable certain checks to avoid build issues
android.disableResourceValidation=true
android.enableNewResourceShrinker=true

# React Native Gesture Handler specific
# Ensure proper Java compilation for gesture handler
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
